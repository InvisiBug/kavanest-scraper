#       ports:
#         - port: 3100

#   loadBalancer:
#     - name: kavanest-api
#       selector: kavanest-api
#       port: 80
#       containerPort: 4000

# ingress:
#   - name: socket.kavanet.io
#     selector: kavanest-scraper
#     path: /
#     port: 3100
#     host: socket.kavanet.io

httpRoute:
  name: socket.kavanet.io
  gatewayName: kavanetes-gateway
  gatewayNamespace: nginx-gateway
  host: socket.kavanet.io
  path: /
  serviceName: socket.kavanet.io
  servicePort: 80

service:
  name: socket.kavanet.io
  selector: kavanest-scraper
  port: 80
  targetPort: 27017
