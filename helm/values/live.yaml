name: kavanest-scraper

namespace: kavanest
env:
  APP_VERSION: f391b6e112526efc32ba91e8693be4f5dfc32cc2

deployment:
  - name: kavanest-scraper
    image: invisibug/kavanest-scraper
    ports:
      - port: 27017
    env:
      - name: MONGO
        value: mongodb://kavanest-mongo

      - name: MQTT
        value: mqtt:mqtt.kavanet.io

# service:
